<!DOCTYPE html>
<html>
<head>
<title>Para ti ❤️</title>

<style>

body{
font-family: Arial;
background: linear-gradient(135deg,#f3d9ff,#e7c6ff);
text-align:center;
padding:50px;
margin:0;
}

.card{
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 10px 20px rgba(0,0,0,0.1);
max-width:600px;
margin:auto;
}

h1{
color:#7b2cbf;
animation: aparecer 2s ease;
}

h2{
color:#5a189a;
}

button{
padding:15px 25px;
font-size:18px;
background:#c77dff;
border:none;
border-radius:10px;
cursor:pointer;
margin-top:20px;
}

button:hover{
background:#9d4edd;
color:white;
}

img{
width:250px;
margin:10px;
border-radius:10px;
}

@keyframes aparecer{
from{opacity:0; transform:translateY(-20px);}
to{opacity:1; transform:translateY(0);}
}

</style>
</head>

<body>

<div class="card">

<h1>Hice esta página para ti ❤️</h1>

<p>
Porque sé que te gustan las páginas web y quería intentar
entrar un poquito a tu mundo.
</p>

<h2>Cosas que amo de ti</h2>

<p>🎹 Tu amor por el piano</p>
<p>♟️ Tu mente para el ajedrez</p>
<p>💻 Tu talento creando páginas</p>

<button onclick="mensaje()">Haz clic aquí</button>

<br><br>

<h2>Un poco de música</h2>

<audio controls>
<source src="piano.mp3" type="audio/mpeg">
</audio>

<br><br>

<h2>Nuestros momentos</h2>

<img src="foto1.jpg">
<img src="foto2.jpg">

</div>

<script>

function mensaje(){
alert("Sabía que ibas a hacer clic ❤️");
}

</script>

<!--
Si estás leyendo este código,
es porque eres el programador que más admiro ❤️
-->

</body>
</html>
